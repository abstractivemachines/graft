pluginGroup = com.abstractivemachines.graft
pluginName = Graft
pluginRepositoryUrl = https://github.com/abstractivemachines/graft
pluginVersion = 0.1.1

# The MCP toolset API (displayName, includeProjectPath, tool hints) is present from 2026.2 (branch 262).
pluginSinceBuild = 262

# WebStorm version to compile against when -PlocalIdePath is not given.
platformVersion = 2026.2.2

gradleVersion = 9.7.1

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

org.gradle.jvmargs = -Xmx2g
